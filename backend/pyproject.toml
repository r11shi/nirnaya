[project]
name = "nirnaya-backend"
version = "1.0.0"
description = "Nirnaya — Personal Financial Risk & Decision Support System"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    
    # Validation & settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    
    # ML core
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "joblib>=1.4.0",
    
    # HTTP
    "httpx>=0.27.0",
    
    # Utils
    "python-dotenv>=1.0.0",
    "uuid7>=0.1.0",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.0.0",
    "faiss-cpu>=1.8.0",
    "lightgbm>=4.4.0",
]
ocr = [
    "paddlepaddle>=2.6.0",
    "paddleocr>=2.8.0",
]
llm = [
    "google-genai>=1.0.0",
    "groq>=0.9.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
